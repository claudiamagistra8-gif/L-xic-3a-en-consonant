<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repàs de morfologia · Grec I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;600;800&family=Noto+Serif:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: classroom drill, clear and encouraging, no clutter
   IDEA: an exam sheet framed by a Greek meander, like a vase band
   PICTURE: the quiz card itself, with a meander band on the header
   COLOUR and TYPE: Aegean blue field, white sheet, terracotta accent; Commissioner + Noto Serif for polytonic Greek
   LAYOUT: menu of section cards -> one question card -> results; tables stack on phones */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0f1720);--ink:light-dark(#14202b,#e6ecf2);--mute:light-dark(#5b6773,#9aa8b6);
--sea:light-dark(#1f4e79,#173b5c);--sea2:light-dark(#e8eff6,#16283a);--line:light-dark(#d6dee6,#2a3b4c);
--terra:light-dark(#c2552d,#e07a4f);--ok:light-dark(#1d7a46,#4cc483);--okb:light-dark(#e5f4ea,#13301f);
--bad:light-dark(#b3261e,#ff7b72);--badb:light-dark(#fbe9e7,#3a1b1a);--card:light-dark(#ffffff,#152230)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Commissioner,system-ui,sans-serif;overflow-x:clip}
.gr{font-family:"Noto Serif","GFS Didot","Times New Roman",serif}
header{background:var(--sea);color:#fff;padding:clamp(22px,3.5vw,44px) max(5vw,16px) 0}
header h1{margin:0;font-size:clamp(28px,4.4vw,44px);line-height:1.05;font-weight:800;text-wrap:balance}
header p{margin:8px 0 18px;max-width:62ch;opacity:.88}
.meander{display:block;width:100%;height:22px;margin-top:6px}
main{max-width:1000px;margin:0 auto;padding:clamp(20px,3vw,40px) max(4vw,16px) 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px}
.sec{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--card);transition:transform .15s,border-color .15s}
.sec:hover,.sec:focus-visible{border-color:var(--sea);transform:translateY(-2px)}
.sec:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.sec h3{margin:0;font-size:19px;line-height:1.2}
.sec .d{color:var(--mute);font-size:14.5px}
.sec .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:6px;font-size:13.5px;color:var(--mute)}
.badge{background:var(--terra);color:#fff;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600}
.sec.big{background:var(--sea2)}
h2{font-size:22px;margin:30px 0 12px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer}
.btn.pri{background:var(--sea);border-color:var(--sea);color:#fff}
.btn:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.bar{flex:1;height:8px;background:var(--sea2);border-radius:9px;overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;background:var(--terra);transition:width .3s}
.count{font-size:14px;color:var(--mute);white-space:nowrap}
.qcard{border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,30px);background:var(--card)}
.qtag{font-size:13.5px;color:var(--terra);font-weight:600;margin-bottom:6px}
.prompt{font-size:19px;line-height:1.45}
.prompt .big{display:block;font-size:clamp(28px,5vw,38px);margin:10px 0 2px;line-height:1.2}
.prompt small{color:var(--mute);font-size:15px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.opt{font:inherit;text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 14px;min-height:52px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.opt .k{font-size:13px;color:var(--mute);font-weight:600;flex:none}
.opt.gr{font-size:21px}
.opt:hover:not(:disabled){border-color:var(--sea)}
.opt:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.bad{border-color:var(--bad);background:var(--badb)}
.opt:disabled{cursor:default}
.fb{margin-top:18px;padding:16px;border-radius:12px;background:var(--sea2);display:none}
.fb.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fb b.v{display:block;font-size:17px;margin-bottom:4px}
.fb b.v.ok{color:var(--ok)}.fb b.v.bad{color:var(--bad)}
.note{margin:6px 0}
.scroll{overflow-x:auto}
table.par{border-collapse:collapse;margin-top:10px;font-size:15px}
.par th,.par td{border:1px solid var(--line);padding:5px 10px;text-align:left}
.par th{font-weight:600;color:var(--mute);font-size:13.5px}
.par td.gr{font-size:17px;white-space:nowrap}
.par td.hl{background:color-mix(in srgb,var(--terra) 22%,transparent);font-weight:600}
.par .art{color:var(--mute);font-size:.85em;margin-right:4px}
.par tr.sub th{background:var(--sea2);color:var(--ink)}
.next{margin-top:16px;display:flex;justify-content:flex-end}
.res{text-align:center;padding:10px 0}
.res .score{font-size:clamp(44px,8vw,64px);font-weight:800;color:var(--sea);line-height:1}
:root[data-theme=dark] .res .score{color:#8fc1ec}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .res .score{color:#8fc1ec}}
.rev{text-align:left;margin-top:22px}
.rev li{margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
select{font:inherit;font-size:16px;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px;max-width:100%}
select.gr{font-family:"Noto Serif",serif;font-size:17px;min-width:9em}
select.ok{border-color:var(--ok);background:var(--okb)}select.bad{border-color:var(--bad);background:var(--badb)}
.tbl td{padding:4px}
.hint{color:var(--mute);font-size:14px}
footer{color:var(--mute);font-size:13.5px;text-align:center;padding:0 16px 30px}
@media(max-width:600px){.opts{grid-template-columns:1fr}.prompt{font-size:17px}table.par{font-size:13px}.par td.gr{font-size:15px}.par th,.par td{padding:4px 6px}}
</style>
</head>
<body>
<header>
  <h1>Repàs de morfologia · Grec I</h1>
  <p>Declinacions, adjectius i verbs. Tria un bloc, respon i mira l'explicació i el paradigma després de cada pregunta. Cada ronda és diferent.</p>
  <svg class="meander" viewBox="0 0 400 22" preserveAspectRatio="none" aria-hidden="true">
    <defs><pattern id="mq" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M1 21V1h18v14H7V7h6v4" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2.2"/></pattern></defs>
    <rect width="400" height="22" fill="url(#mq)"/>
  </svg>
</header>
<main id="app"></main>
<footer>Abreviatures: N(om.), V(oc.), Ac., Gen., Dat. · sg. singular · pl. plural · m., f., n.</footer>
<script>
{
/* ================= DADES ================= */
const CASES=['N','V','A','G','D'],NUMS=['sg','pl'];
const CF={N:'nominatiu',V:'vocatiu',A:'acusatiu',G:'genitiu',D:'datiu'};
const CA={N:'Nom.',V:'Voc.',A:'Ac.',G:'Gen.',D:'Dat.'};
const NN={sg:'singular',pl:'plural'};
const GN={m:'masculí',f:'femení',n:'neutre'};
const artRow=s=>{const a=s.split(' '),o={};NUMS.forEach((nm,j)=>CASES.forEach((c,i)=>o[c+' '+nm]=a[j*5+i]));return o};
const ART={m:artRow('ὁ ὦ τὸν τοῦ τῷ οἱ ὦ τοὺς τῶν τοῖς'),f:artRow('ἡ ὦ τὴν τῆς τῇ αἱ ὦ τὰς τῶν ταῖς'),n:artRow('τὸ ὦ τὸ τοῦ τῷ τὰ ὦ τὰ τῶν τοῖς')};

const T={p:'1a decl. · femení en -α pura',x:'1a decl. · femení en -α mixta',e:'1a decl. · femení en -η',as:'1a decl. · masculí en -ας',es:'1a decl. · masculí en -ης',
o:'2a decl. · masculí en -ος',of:'2a decl. · femení en -ος',on:'2a decl. · neutre en -ον',
g:'3a decl. · oclusiva gutural (κ, γ, χ)',l:'3a decl. · oclusiva labial (π, β, φ)',d:'3a decl. · oclusiva dental (τ, δ, θ)',n:'3a decl. · nasal (ν)'};
const PH={g:'Gutural + σ → ξ (al nom. sg. i al dat. pl.).',l:'Labial + σ → ψ (al nom. sg. i al dat. pl.).',d:'La dental (τ, δ, θ) cau davant σ i a final de paraula.',
n:'La ν cau davant σ (dat. pl.). Nom. sg. sense -ς; si la vocal de l’arrel és breu, s’allarga (ο → ω, ε → η).'};

const NOUNS=[];
function noun(sec,t,lemma,gen,art,cat,sg,pl,x={}){
  const g={'ὁ':'m','ἡ':'f','τό':'n'}[art];const f={};const s=sg.split(' '),p=pl.split(' ');
  CASES.forEach((c,i)=>{f[c+' sg']=s[i];f[c+' pl']=p[i]});
  NOUNS.push({sec,t,type:T[t],lemma,gen,art,g,cat,f,enunc:`${lemma}, ${gen} (${art})`,...x});
}
// 1a i 2a
noun('d12','p','θεά','θεᾶς','ἡ','deessa','θεά θεά θεάν θεᾶς θεᾷ','θεαί θεαί θεάς θεῶν θεαῖς');
noun('d12','p','χώρα','χώρας','ἡ','regió, territori','χώρα χώρα χώραν χώρας χώρᾳ','χῶραι χῶραι χώρας χωρῶν χώραις');
noun('d12','x','δόξα','δόξης','ἡ','opinió, glòria','δόξα δόξα δόξαν δόξης δόξῃ','δόξαι δόξαι δόξας δοξῶν δόξαις');
noun('d12','e','κόρη','κόρης','ἡ','xica','κόρη κόρη κόρην κόρης κόρῃ','κόραι κόραι κόρας κορῶν κόραις');
noun('d12','as','νεανίας','νεανίου','ὁ','jove','νεανίας νεανία νεανίαν νεανίου νεανίᾳ','νεανίαι νεανίαι νεανίας νεανιῶν νεανίαις');
noun('d12','es','πολίτης','πολίτου','ὁ','ciutadà','πολίτης πολῖτα πολίτην πολίτου πολίτῃ','πολῖται πολῖται πολίτας πολιτῶν πολίταις');
noun('d12','o','λόγος','λόγου','ὁ','paraula','λόγος λόγε λόγον λόγου λόγῳ','λόγοι λόγοι λόγους λόγων λόγοις');
noun('d12','of','ὁδός','ὁδοῦ','ἡ','camí','ὁδός ὁδέ ὁδόν ὁδοῦ ὁδῷ','ὁδοί ὁδοί ὁδούς ὁδῶν ὁδοῖς');
noun('d12','on','δῶρον','δώρου','τό','regal, do','δῶρον δῶρον δῶρον δώρου δώρῳ','δῶρα δῶρα δῶρα δώρων δώροις');
noun('d12','o','ἄνθρωπος','ἀνθρώπου','ὁ','persona, ésser humà','ἄνθρωπος ἄνθρωπε ἄνθρωπον ἀνθρώπου ἀνθρώπῳ','ἄνθρωποι ἄνθρωποι ἀνθρώπους ἀνθρώπων ἀνθρώποις');
// 3a oclusiva
noun('ocl','g','φύλαξ','φύλακος','ὁ','guardià','φύλαξ φύλαξ φύλακα φύλακος φύλακι','φύλακες φύλακες φύλακας φυλάκων φύλαξι(ν)',{root:'φυλακ-',fake:['φύλακς, φύλακος','φύλαψ, φύλακος','φύλαξ, φύλαξος'],fakeRoot:['φυλαξ-','φυλα-','φυλακος-'],trap:{'D pl':['φύλακσι(ν)','φυλάκοις'],'N sg':['φύλακς']}});
noun('ocl','g','κῆρυξ','κήρυκος','ὁ','herald','κῆρυξ κῆρυξ κήρυκα κήρυκος κήρυκι','κήρυκες κήρυκες κήρυκας κηρύκων κήρυξι(ν)',{root:'κηρυκ-',fake:['κῆρυκς, κήρυκος','κῆρυψ, κήρυκος','κῆρυξ, κήρυξος'],fakeRoot:['κηρυξ-','κηρυ-','κηρυγ-'],trap:{'D pl':['κήρυκσι(ν)','κηρύκοις']}});
noun('ocl','g','κόραξ','κόρακος','ὁ','corb','κόραξ κόραξ κόρακα κόρακος κόρακι','κόρακες κόρακες κόρακας κοράκων κόραξι(ν)',{root:'κορακ-',fake:['κόρακς, κόρακος','κόραψ, κόρακος','κόραξ, κόραξος'],fakeRoot:['κοραξ-','κορα-','κορακος-'],trap:{'D pl':['κόρακσι(ν)','κοράκοις']}});
noun('ocl','g','αἴξ','αἰγός','ἡ','cabra','αἴξ αἴξ αἶγα αἰγός αἰγί','αἶγες αἶγες αἶγας αἰγῶν αἰξί(ν)',{root:'αἰγ-',fake:['αἴγς, αἰγός','αἴψ, αἰγός','αἴς, αἰγός'],fakeRoot:['αἰξ-','αἰ-','αἰκ-'],trap:{'D pl':['αἰγσί(ν)','αἰγοῖς']}});
noun('ocl','l','Αἰθίοψ','Αἰθίοπος','ὁ','etíop','Αἰθίοψ Αἰθίοψ Αἰθίοπα Αἰθίοπος Αἰθίοπι','Αἰθίοπες Αἰθίοπες Αἰθίοπας Αἰθιόπων Αἰθίοψι(ν)',{root:'Αἰθιοπ-',fake:['Αἰθίοπς, Αἰθίοπος','Αἰθίοξ, Αἰθίοπος','Αἰθίοψ, Αἰθίοψος'],fakeRoot:['Αἰθιοψ-','Αἰθιο-','Αἰθιοβ-'],trap:{'D pl':['Αἰθίοπσι(ν)','Αἰθιόποις']}});
noun('ocl','l','φλέψ','φλεβός','ἡ','vena','φλέψ φλέψ φλέβα φλεβός φλεβί','φλέβες φλέβες φλέβας φλεβῶν φλεψί(ν)',{root:'φλεβ-',fake:['φλέβς, φλεβός','φλέξ, φλεβός','φλέψ, φλεψός'],fakeRoot:['φλεψ-','φλε-','φλεπ-'],trap:{'D pl':['φλεβσί(ν)','φλεβοῖς']}});
noun('ocl','l','γύψ','γυπός','ὁ','voltor','γύψ γύψ γῦπα γυπός γυπί','γῦπες γῦπες γῦπας γυπῶν γυψί(ν)',{root:'γυπ-',fake:['γύπς, γυπός','γύξ, γυπός','γύψ, γυψός'],fakeRoot:['γυψ-','γυ-','γυβ-'],trap:{'D pl':['γυπσί(ν)','γυποῖς']}});
noun('ocl','d','ἐλπίς','ἐλπίδος','ἡ','esperança','ἐλπίς ἐλπί ἐλπίδα ἐλπίδος ἐλπίδι','ἐλπίδες ἐλπίδες ἐλπίδας ἐλπίδων ἐλπίσι(ν)',{root:'ἐλπιδ-',fake:['ἐλπίδς, ἐλπίδος','ἐλπίξ, ἐλπίδος','ἐλπίς, ἐλπίσος'],fakeRoot:['ἐλπισ-','ἐλπι-','ἐλπιτ-'],trap:{'D pl':['ἐλπίδσι(ν)','ἐλπίδοις']}});
noun('ocl','d','παῖς','παιδός','ὁ','xiquet, nen','παῖς παῖ παῖδα παιδός παιδί','παῖδες παῖδες παῖδας παίδων παισί(ν)',{root:'παιδ-',fake:['παῖδς, παιδός','παῖξ, παιδός','παῖς, παισός'],fakeRoot:['παισ-','παι-','παιτ-'],trap:{'D pl':['παιδσί(ν)','παιδοῖς']}});
noun('ocl','d','σῶμα','σώματος','τό','cos','σῶμα σῶμα σῶμα σώματος σώματι','σώματα σώματα σώματα σωμάτων σώμασι(ν)',{root:'σωματ-',fake:['σῶματ, σώματος','σῶμας, σώματος','σῶμα, σώμου'],fakeRoot:['σωμα-','σωμ-','σωματος-'],trap:{'D pl':['σώματσι(ν)','σωμάτοις'],'N pl':['σώματες']},note:'Neutre: N, V i Ac. iguals. Al nom. sg. la τ final cau (cap paraula grega acaba en τ).'});
noun('ocl','d','πρᾶγμα','πράγματος','τό','assumpte, cosa','πρᾶγμα πρᾶγμα πρᾶγμα πράγματος πράγματι','πράγματα πράγματα πράγματα πραγμάτων πράγμασι(ν)',{root:'πραγματ-',fake:['πρᾶγματ, πράγματος','πρᾶγμας, πράγματος','πρᾶγμα, πράγμου'],fakeRoot:['πραγμα-','πραγμ-','πραγματος-'],trap:{'D pl':['πράγματσι(ν)','πραγμάτοις'],'N pl':['πράγματες']},note:'Neutre: N, V i Ac. iguals. Al nom. sg. la τ final cau (cap paraula grega acaba en τ).'});
noun('ocl','d','νύξ','νυκτός','ἡ','nit','νύξ νύξ νύκτα νυκτός νυκτί','νύκτες νύκτες νύκτας νυκτῶν νυξί(ν)',{root:'νυκτ-',noType:1,fake:['νύκτς, νυκτός','νύκς, νυκτός','νύψ, νυκτός'],fakeRoot:['νυξ-','νυκ-','νυ-'],trap:{'D pl':['νυκτσί(ν)','νυκσί(ν)']},note:'Arrel νυκτ-: davant σ cau la τ i κ + σ → ξ (νύξ, νυξί).'});
// 3a nasal
noun('nas','n','δαίμων','δαίμονος','ὁ','divinitat','δαίμων δαῖμον δαίμονα δαίμονος δαίμονι','δαίμονες δαίμονες δαίμονας δαιμόνων δαίμοσι(ν)',{root:'δαιμον-',fake:['δαίμονς, δαίμονος','δαίμον, δαίμονος','δαίμων, δαίμωνος'],fakeRoot:['δαιμων-','δαιμ-','δαιμονος-'],trap:{'D pl':['δαίμονσι(ν)','δαιμόνοις','δαίμωσι(ν)']},note:'Vocatiu: l’arrel pura, δαῖμον.'});
noun('nas','n','ποιμήν','ποιμένος','ὁ','pastor','ποιμήν ποιμήν ποιμένα ποιμένος ποιμένι','ποιμένες ποιμένες ποιμένας ποιμένων ποιμέσι(ν)',{root:'ποιμεν-',fake:['ποιμένς, ποιμένος','ποιμέν, ποιμένος','ποιμήν, ποιμῆνος'],fakeRoot:['ποιμην-','ποιμ-','ποιμενος-'],trap:{'D pl':['ποιμένσι(ν)','ποιμῆσι(ν)']}});
noun('nas','n','λιμήν','λιμένος','ὁ','port','λιμήν λιμήν λιμένα λιμένος λιμένι','λιμένες λιμένες λιμένας λιμένων λιμέσι(ν)',{root:'λιμεν-',fake:['λιμένς, λιμένος','λιμέν, λιμένος','λιμήν, λιμῆνος'],fakeRoot:['λιμην-','λιμ-','λιμενος-'],trap:{'D pl':['λιμένσι(ν)','λιμῆσι(ν)']}});
noun('nas','n','ἀγών','ἀγῶνος','ὁ','competició, lluita','ἀγών ἀγών ἀγῶνα ἀγῶνος ἀγῶνι','ἀγῶνες ἀγῶνες ἀγῶνας ἀγώνων ἀγῶσι(ν)',{root:'ἀγων-',fake:['ἀγῶνς, ἀγῶνος','ἀγόν, ἀγῶνος','ἀγών, ἀγόνος'],fakeRoot:['ἀγον-','ἀγ-','ἀγωνος-'],trap:{'D pl':['ἀγῶνσι(ν)','ἀγώνοις']},note:'La vocal de l’arrel ja és llarga (ω): el nom. no canvia.'});

const VERBS=[];
function verb(lemma,cat,pres,fut,fpas,trapF=[],trapP=[],note=''){

}

const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function mkQ(tag,prompt,correct,pools,expl){
  const ds=[];
  for(const p of pools){for(const x of shuffle([...new Set(p)])){if(ds.length>=3)break;if(x&&x!==correct&&!ds.includes(x))ds.push(x)}}
  if(ds.length<3)return null;
  const opts=shuffle([correct,...ds]);
  return {tag,prompt,opts,ans:opts.indexOf(correct),expl};
}
const G=s=>`<span class="gr">${s}</span>`;

function tNoun(n,hl){
  let h='<div class="scroll"><table class="par"><thead><tr><th></th><th>Singular</th><th>Plural</th></tr></thead><tbody>';
  CASES.forEach(c=>{h+=`<tr><th>${c}</th>`+NUMS.map(nm=>{const k=c+' '+nm;return `<td class="gr${hl.includes(k)?' hl':''}"><span class="art">${ART[n.g][k]}</span>${n.f[k]}</td>`}).join('')+'</tr>'});
  return h+'</tbody></table></div>';
}
const adjGs=a=>a.two?['m','n']:['m','f','n'];
function tAdj(a,hl){
  const gs=adjGs(a),lab=a.two?['m./f.','n.']:['m.','f.','n.'];
  let h=`<div class="scroll"><table class="par"><thead><tr><th></th>${lab.map(l=>`<th>${l}</th>`).join('')}</tr></thead><tbody>`;
  NUMS.forEach(nm=>{h+=`<tr class="sub"><th colspan="${gs.length+1}">${NN[nm]}</th></tr>`;
    CASES.forEach(c=>{h+=`<tr><th>${c}</th>`+gs.map(g=>{const k=g+' '+c+' '+nm;const on=hl.includes(k)||(a.two&&g==='m'&&hl.includes('f '+c+' '+nm));return `<td class="gr${on?' hl':''}">${a.f[k]}</td>`}).join('')+'</tr>'})});
  return h+'</tbody></table></div>';
}
function tVerb(v,tvs,hl){
  tvs=tvs.filter(t=>v.f[t]);
  let h=`<div class="scroll"><table class="par"><thead><tr><th></th>${tvs.map(t=>`<th>${TVN[t].replace(' ind.','')}</th>`).join('')}</tr></thead><tbody>`;
  PERS.forEach((p,i)=>{h+=`<tr><th>${p}</th>`+tvs.map(t=>`<td class="gr${hl.includes(t+' '+i)?' hl':''}">${v.f[t][i]}</td>`).join('')+'</tr>'});
  return h+'</tbody></table></div>';

const notes=a=>a.filter(Boolean).map(x=>`<p class="note">${x}</p>`).join('');
function nounNotes(n){return [n.note,PH[n.t],n.root?`Arrel: ${G(n.root)} (del genitiu ${G(n.gen)}).`:null]}

function fmtNoun(ks){
  return NUMS.map(nm=>{const cs=CASES.filter(c=>ks.includes(c+' '+nm));return cs.length?`${cs.map(c=>CA[c]).join(', ')} ${nm}.`:null}).filter(Boolean).join(' / ');
}

  const k=pick(keys),[c,nm]=k.split(' '),cor=n.f[k];
  const near=[n.f[c+' '+(nm==='sg'?'pl':'sg')],...CASES.map(x=>n.f[x+' '+nm])];
  return mkQ(tagOf(n),`Quina és la forma de <b>${CF[c]} ${NN[nm]}</b> de ${G(n.enunc)} <i>‘${n.cat}’</i>?`,cor,[(n.trap&&n.trap[k])||[],near,Object.values(n.f)],

  return mkQ(tagOf(n),`Analitza la forma:<span class="big gr">${form}</span><small>de ${G(n.enunc)} ‘${n.cat}’</small>`,cor,[other,ALLNOUNLAB],
    notes([ks.length>1?'Aquesta forma pot ser més d’un cas: a l’examen cal indicar-los tots.':null,...nounNotes(n)])+tNoun(n,ks));

function qNounRoot(n){

    notes([`L’arrel s’obté del genitiu singular traient -ος: ${G(n.gen)} → ${G(n.root)}.`,PH[n.t]]));

function qNounEnunc(n){
  return mkQ(tagOf(n),`L’arrel és ${G(n.root)} (${n.art}) <i>‘${n.cat}’</i>. Quin és l’enunciat correcte?`,`${n.lemma}, ${n.gen}`,[n.fake],
    notes([n.note||PH[n.t]])+tNoun(n,['N sg','G sg']));

function fmtAdj(a,ks){
  const gs=adjGs(a),map={};
  ks.forEach(k=>{let [g,c,nm]=k.split(' ');if(a.two&&g==='f')g='m';(map[c+' '+nm]=map[c+' '+nm]||new Set()).add(g)});
  const gl=s=>{const l=gs.filter(g=>s.has(g)).map(g=>a.two&&g==='m'?'m./f.':g+'.');return l.length===gs.length?(a.two?'m., f. i n.':'m., f. i n.'):l.join(' i ')};
  const groups={};
  NUMS.forEach(nm=>CASES.forEach(c=>{const s=map[c+' '+nm];if(!s)return;const key=nm+'|'+gl(s);(groups[key]=groups[key]||[]).push(c)}));
  return Object.entries(groups).map(([k,cs])=>{const [nm,g]=k.split('|');return `${cs.map(c=>CA[c]).join(', ')} ${nm}. ${g}`}).join(' / ');
}
const tagA=a=>a.sec==='adj'?'Adjectius 2-1-2 i 2-2':'Adjectius 3-1-3 i 3-3 (nasal)';

  const g=pick(adjGs(a)),c=Math.random()<.15?'V':pick(['N','A','G','D']),nm=pick(NUMS),k=g+' '+c+' '+nm,cor=a.f[k];
  const gname=a.two&&g==='m'?'masculí/femení':GN[g];
  const near=['m','f','n'].map(x=>a.f[x+' '+c+' '+nm]).concat(CASES.map(x=>a.f[g+' '+x+' '+nm]));
  return mkQ(tagA(a),`Quina és la forma de <b>${CF[c]} ${NN[nm]} ${gname}</b> de ${G(a.enunc)} <i>‘${a.cat}’</i>?`,cor,[near,Object.values(a.f)],
    notes([a.note])+tAdj(a,[k]));
}
function qAdjAnalyze(a){
  const keys=Object.keys(a.f).filter(k=>!(a.two&&k[0]==='f'));
  const form=a.f[pick(keys)],ks=keys.filter(k=>a.f[k]===form),cor=fmtAdj(a,ks);
  const other=[...new Set(keys.map(k=>a.f[k]))].map(f=>fmtAdj(a,keys.filter(k=>a.f[k]===f)));
  return mkQ(tagA(a),`Analitza la forma:<span class="big gr">${form}</span><small>de ${G(a.enunc)} ‘${a.cat}’</small>`,cor,[other],
    notes([ks.length>1?'Forma ambigua: indica totes les possibilitats.':null,a.note])+tAdj(a,ks));

function qAdjType(a){

function qAgree(a,nouns){
  const n=pick(nouns),c=pick(['N','A','G','D']),nm=pick(NUMS),g=n.g;
  const nf=n.f[c+' '+nm],art=ART[g][c+' '+nm],k=g+' '+c+' '+nm,cor=a.f[k];
  const near=['m','f','n'].map(x=>a.f[x+' '+c+' '+nm]).concat(CASES.map(x=>a.f[g+' '+x+' '+nm]));

const tagV=tvs=>tvs.includes('fa')||tvs.includes('fp')?'Futur actiu, mitjà i passiu':'Present actiu i mitjà-passiu';
function qVerbAnalyze(v,tvs,all){
  const av=tvs.filter(t=>v.f[t]);if(!av.length)return null;
  const tv=pick(av),p=Math.floor(Math.random()*6),form=v.f[tv][p],cor=`${PERS[p]} ${TVN[tv]}`;
  const avAll=all.filter(t=>v.f[t]);
  const sameTv=PERS.map((x,i)=>`${x} ${TVN[tv]}`),samePer=avAll.map(t=>`${PERS[p]} ${TVN[t]}`),rest=Object.keys(TVN).flatMap(t=>PERS.map(x=>`${x} ${TVN[t]}`));

function qVerbForm(v,tvs){
  const av=tvs.filter(t=>v.f[t]);if(!av.length)return null;

const SECNAME={d12:'1a i 2a declinació',ocl:'3a decl. · oclusiva',nas:'3a decl. · nasal',adj:'Adjectius 2-1-2 i 2-2',adjn:'Adjectius 3-1-3 i 3-3 (nasal)',pres:'Present actiu i mitjà-passiu',fut:'Futur actiu, mitjà i passiu'};

ocl:[[3,()=>qNounForm(pick(NOC))],[3,()=>qNounAnalyze(pick(NOC))],[2,()=>qNounEnunc(pick(NOC))],[1,()=>qNounRoot(pick(NOC))],[1.2,()=>qNounType(pick(NOC))],[2.5,()=>qStatic('ocl')]],
nas:[[3,()=>qNounForm(pick(NNA))],[3,()=>qNounAnalyze(pick(NNA))],[1.5,()=>qNounEnunc(pick(NNA))],[1,()=>qNounRoot(pick(NNA))],[1,()=>qNounType(pick(N3))],[2.5,()=>qStatic('nas')]],

pres:[[3.5,()=>qVerbAnalyze(pick(VERBS),PR,PR)],[3,()=>qVerbForm(pick(VERBS),PR)],[1.5,()=>qStatic('pres')]],

const MIXW={d12:1,ocl:3,nas:2.5,adj:1,adjn:2.5,pres:1,fut:2};
const wpick=list=>{let t=list.reduce((s,x)=>s+x[0],0),r=Math.random()*t;for(const x of list){if((r-=x[0])<=0)return x[1]}return list[list.length-1][1]};
function build(id,n){
  const out=[],seen=new Set();let tries=0;
  while(out.length<n&&tries++<600){
    const sid=id==='mix'?wpick(Object.entries(MIXW).map(([k,w])=>[w,k])):id;
    const q=wpick(GENS[sid])();
    if(q&&!seen.has(q.prompt)){seen.add(q.prompt);out.push(q)}
  }
  return out;
}

function showQ(){
  const q=S.qs[S.i];S.done=false;
  app.innerHTML=`<div class="top"><button class="btn" data-go="home">← Inici</button><div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div><span class="count">${S.i+1} / ${S.qs.length} · ${S.score} encerts</span></div>
  <div class="qcard"><div class="qtag">${q.tag}</div><div class="prompt">${q.prompt}</div>
  <div class="opts">${q.opts.map((o,i)=>`<button class="opt${/[a-zà-úç]/i.test(o.replace(/<[^>]+>/g,''))?'':' gr'}" data-o="${i}"><span class="k">${i+1}</span><span>${o}</span></button>`).join('')}</div>
  <div class="fb" id="fb"></div><div class="next" id="nx"></div></div>`;
  app.querySelector('.opt').focus({preventScroll:true});
}
function answer(i){
  if(!S||S.done)return;S.done=true;
  const q=S.qs[S.i],ok=i===q.ans,bs=app.querySelectorAll('.opt');
  bs.forEach((b,j)=>{b.disabled=true;if(j===q.ans)b.classList.add('ok');else if(j===i)b.classList.add('bad')});
  if(ok)S.score++;else S.wrong.push(q);
  const fb=document.getElementById('fb');
  fb.innerHTML=`<b class="v ${ok?'ok':'bad'}">${ok?pick(OKW):pick(BADW)+' La resposta correcta és: '+q.opts[q.ans]}</b>${q.expl}`;
  fb.classList.add('on');
  const last=S.i===S.qs.length-1;
  document.getElementById('nx').innerHTML=`<button class="btn pri" id="go">${last?'Veure resultat':'Següent →'}</button>`;
  document.getElementById('go').focus({preventScroll:true});
}
function next(){if(!S)return;if(S.i<S.qs.length-1){S.i++;showQ();window.scrollTo(0,0)}else result()}
function result(){
  const pc=Math.round(S.score/S.qs.length*100);
  if(S.id!=='retry'){const b=store.get('best:'+S.id);if(b==null||pc>b)store.set('best:'+S.id,pc)}
  const msg=pc>=90?'Excel·lent! Domines aquest bloc.':pc>=70?'Molt bé! Repassa els errors i ho tindràs.':pc>=50?'Vas bé, però convé repassar els paradigmes.':'Torna a mirar els paradigmes i prova una altra ronda.';
  app.innerHTML=`<div class="top"><button class="btn" data-go="home">← Inici</button></div><div class="qcard res">
  <div class="qtag">${S.name}</div><div class="score">${S.score} / ${S.qs.length}</div><p>${pc}% · ${msg}</p>
  <div class="row">${S.wrong.length?'<button class="btn pri" data-go="retry">Repeteix els errors</button>':''}<button class="btn${S.wrong.length?'':' pri'}" data-go="again">Nova ronda</button><button class="btn" data-go="home">Altres blocs</button></div>
  ${S.wrong.length?`<div class="rev"><h3>Errors</h3><ol>${S.wrong.map(q=>`<li>${q.prompt.replace(/<span class="big gr">/,' <span class="gr"><b>').replace(/<\/span><small>/,'</b></span> <small>')} → <b>${q.opts[q.ans]}</b></li>`).join('')}</ol></div>`:''}</div>`;
  window.scrollTo(0,0);
}

/* ---- mode taula ---- */
function tablesView(sel){
  const items=[...NOUNS.map((n,i)=>({k:'n'+i,l:n.enunc,g:tagOf(n)})),...ADJS.map((a,i)=>({k:'a'+i,l:a.enunc,g:tagA(a)})),...VERBS.map((v,i)=>({k:'v'+i,l:v.lemma,g:'Verbs'}))];
  sel=sel||'n'+NOUNS.indexOf(NOC[0]);
  const groups=[...new Set(items.map(x=>x.g))];
  app.innerHTML=`<div class="top"><button class="btn" data-go="home">← Inici</button><select id="tsel" class="gr" aria-label="Paraula">${groups.map(g=>`<optgroup label="${g}">${items.filter(x=>x.g===g).map(x=>`<option value="${x.k}"${x.k===sel?' selected':''}>${x.l}</option>`).join('')}</optgroup>`).join('')}</select></div>
  <div class="qcard"><p class="hint">Tria la forma correcta a cada casella i prem «Comprova».</p><div id="tb"></div>
  <div class="row"><button class="btn pri" id="chk">Comprova</button><button class="btn" id="sol">Mostra la solució</button><button class="btn" id="rst">Torna a començar</button></div><p id="tres" class="hint" style="text-align:center"></p></div>`;
  renderTable(sel);
}
let TB=null;
function selCell(id,ans,opts){return `<select class="gr" data-a="${ans}" id="${id}"><option value="">—</option>${opts.map(o=>`<option>${o}</option>`).join('')}</select>`}
function renderTable(k){
  const t=k[0],i=+k.slice(1);let h='';
  if(t==='n'){const n=NOUNS[i];
    const col=nm=>shuffle([...new Set(CASES.map(c=>n.f[c+' '+nm]).concat(Object.entries(n.trap||{}).filter(([kk])=>kk.endsWith(nm)).flatMap(x=>x[1])))]);
    const o={sg:col('sg'),pl:col('pl')};
    h=`<p>${G(n.enunc)} ‘${n.cat}’</p><div class="scroll"><table class="par tbl"><tr><th></th><th>Singular</th><th>Plural</th></tr>${CASES.map(c=>`<tr><th>${c}</th>${NUMS.map(nm=>`<td>${selCell('c'+c+nm,n.f[c+' '+nm],o[nm])}</td>`).join('')}</tr>`).join('')}</table></div>`;
  }else if(t==='a'){const a=ADJS[i],gs=adjGs(a),lab=a.two?['m./f.','n.']:['m.','f.','n.'];
    const o={};gs.forEach(g=>o[g]=shuffle([...new Set(Object.keys(a.f).filter(x=>x[0]===g).map(x=>a.f[x]))]));
    h=`<p>${G(a.enunc)} ‘${a.cat}’</p><div class="scroll"><table class="par tbl"><tr><th></th>${lab.map(l=>`<th>${l}</th>`).join('')}</tr>${NUMS.map(nm=>`<tr class="sub"><th colspan="${gs.length+1}">${NN[nm]}</th></tr>`+CASES.map(c=>`<tr><th>${c}</th>${gs.map(g=>`<td>${selCell('c'+g+c+nm,a.f[g+' '+c+' '+nm],o[g])}</td>`).join('')}</tr>`).join('')).join('')}</table></div>`;
  }else{const v=VERBS[i],tvs=ALLTV.filter(x=>v.f[x]);
    h=`<p>${G(v.lemma)} ‘${v.cat}’</p><div class="scroll"><table class="par tbl"><tr><th></th>${tvs.map(x=>`<th>${TVN[x].replace(' ind.','')}</th>`).join('')}</tr>${PERS.map((p,j)=>`<tr><th>${p}</th>${tvs.map(x=>`<td>${selCell('c'+x+j,v.f[x][j],shuffle(v.f[x]))}</td>`).join('')}</tr>`).join('')}</table></div>`;
  }
  document.getElementById('tb').innerHTML=h;document.getElementById('tres').textContent='';TB=k;
}
function checkTable(show){
  const ss=[...document.querySelectorAll('#tb select')];let ok=0;
  ss.forEach(s=>{if(show)s.value=s.dataset.a;const good=s.value===s.dataset.a;s.classList.toggle('ok',good);s.classList.toggle('bad',!good&&s.value!=='');if(good)ok++});
  document.getElementById('tres').textContent=show?'Solució mostrada.':`${ok} de ${ss.length} caselles correctes${ok===ss.length?' · Perfecte!':''}`;
}

app.addEventListener('click',e=>{
  const o=e.target.closest('.opt');if(o){answer(+o.dataset.o);return}
  if(e.target.closest('#go')){next();return}
  if(e.target.id==='chk'){checkTable(false);return}
  if(e.target.id==='sol'){checkTable(true);return}
  if(e.target.id==='rst'){renderTable(TB);return}
  const g=e.target.closest('[data-go]');if(!g)return;const id=g.dataset.go;
  if(id==='home')home();
  else if(id==='taules')tablesView();
  else if(id==='retry'){const w=shuffle(S.wrong).map(q=>{const opts=shuffle(q.opts),c=q.opts[q.ans];return {...q,opts,ans:opts.indexOf(c)}});const nm=S.name;S={id:'retry',name:nm+' · errors',qs:w,i:0,score:0,wrong:[]};showQ()}
  else if(id==='again')start(S.id==='retry'?'mix':S.id);
  else start(id);
});
app.addEventListener('change',e=>{if(e.target.id==='tsel')renderTable(e.target.value)});
document.addEventListener('keydown',e=>{
  if(!S||!document.querySelector('.opts'))return;
  if(!S.done&&/^[1-4]$/.test(e.key))answer(+e.key-1);
  else if(S.done&&(e.key==='Enter'||e.key==='ArrowRight')&&document.activeElement.id!=='go'){e.preventDefault();next()}
});
home();
}
globalThis.__T={build,SECTIONS,NOUNS,ADJS,VERBS};
}
</script>
